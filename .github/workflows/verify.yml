name: Verify
on: [push, pull_request]
permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0; Node 24
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit and no-send integration tests
        run: python -m unittest discover -s tests -v
      - name: Check staged source for privacy leaks
        run: python scripts/privacy_check.py
      - name: Parse Windows PowerShell scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $files = @('enable_booking.ps1','start_booking.ps1','stop_booking.ps1',
                     'sync_schedule.ps1','scripts/install_desktop_launcher.ps1',
                     'scripts/initialize_booking.ps1','scripts/launch_booking.ps1')
          foreach ($name in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $name), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
            Write-Host "PowerShell syntax OK: $name"
          }
